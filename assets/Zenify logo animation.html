<script>
// Balanced, cinematic opening sequence (~2.0s entrance). Full logo stays on screen. Click to replay.
const ls=[...document.querySelectorAll('.l')];
ls[1].id='e';
const expo='cubic-bezier(.16,1,.3,1)', B='blur(5px)', N='blur(0px)';
const fx=[
 // Z: drawn on from left with a skew that straightens
 {d:0,t:1100,k:[{opacity:1,clipPath:'inset(0 100% 0 0)',transform:'translateX(-8%) skewX(-14deg)',filter:B},{opacity:1,clipPath:'inset(0 -2% 0 0)',transform:'none',filter:N}]},
 // E: a circular sweep draws the letter as it unspins
 {d:160,t:1200,k:[{opacity:0,'--a':'-10deg',transform:'rotate(-120deg) scale(.7)',filter:B},{opacity:1,offset:.12,'--a':'-10deg'},{opacity:1,'--a':'360deg',transform:'none',filter:N}]},
 // N: rises up like a curtain
 {d:320,t:1100,k:[{opacity:1,clipPath:'inset(100% 0 0 0)',transform:'translateY(14%)',filter:B},{opacity:1,clipPath:'inset(-2% 0 0 0)',transform:'none',filter:N}]},
 // I: drops in stretched and lands with a soft squash
 {d:480,t:1050,o:'bottom',e:'linear',k:[{opacity:0,transform:'translateY(-260%) scaleY(2.2)',easing:expo},{opacity:1,offset:.7,transform:'translateY(0) scaleY(.92)',easing:'ease-out'},{opacity:1,transform:'none'}]},
 // F: slides in from the right with a speed stretch
 {d:640,t:1100,o:'left',k:[{opacity:1,clipPath:'inset(0 0 0 100%)',transform:'translateX(80%) scaleX(1.8)',filter:B},{opacity:1,clipPath:'inset(0 0 0 -2%)',transform:'none',filter:N}]},
 // Y: flips up from its base like a pop-up card
 {d:800,t:1150,o:'bottom',k:[{opacity:0,transform:'perspective(700px) rotateX(-100deg)',filter:B},{opacity:1,offset:.25},{opacity:1,transform:'none',filter:N}]}
];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){
  document.getAnimations().forEach(a=>a.cancel());
  if(reduce){ls.forEach(l=>l.style.opacity=1);return}
  ls.forEach((el,i)=>{
    const f=fx[i]; el.style.transformOrigin=f.o||'center';
    el.animate(f.k,{duration:f.t,delay:f.d,easing:f.e||expo,fill:'both'});
  });
  document.getElementById('logo').animate([{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:2100,easing:expo,fill:'both'});
}
play();
document.body.addEventListener('click',play);
</script></body></html>

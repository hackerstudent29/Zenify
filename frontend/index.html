<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_z_512.png?v=5" />
    <link rel="apple-touch-icon" href="/favicon_z_512.png?v=5" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Primary Fallback Meta Tags -->
    <title>Zenify – Free Music Player with Synced Lyrics & 8D Audio</title>
    <meta name="title" content="Zenify – Free Music Player with Synced Lyrics & 8D Audio" />
    <meta name="description" content="Free open-source web music player with sub-second synced lyrics for Tamil, Tanglish, Hindi & English, 8D audio, a 3-band EQ and nightcore/slowed effects." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Zenify" />
    <meta name="google-site-verification" content="google66ee582c33341a73" />
    <meta name="google-site-verification" content="66ee582c33341a73" />

    <!-- Performance preconnects (Fonts are bundled locally via @fontsource) -->
    <link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    
    <script>
      // Auto-reload and unregister PWA if Vite chunks fail to load (MIME type mismatch)
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('Failed to fetch dynamically imported module')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(let reg of regs) reg.unregister();
            });
          }
          window.location.reload();
        }
      });
    </script>
    <style>
      :root {
        --font-inter: 'Inter', system-ui, -apple-system, sans-serif;
        --font-outfit: 'Outfit', sans-serif;
        --font-cormorant: 'Cormorant Garamond', serif;
      }
    </style>
  </head>
  <body class="bg-background text-foreground h-screen flex flex-col overflow-hidden font-sans font-semibold antialiased">
    <div id="root" class="h-full w-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

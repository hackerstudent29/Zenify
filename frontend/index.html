    <title>Zenify – Free Music Player with Synced Lyrics & 8D Audio</title>
    <meta name="title" content="Zenify – Free Music Player with Synced Lyrics & 8D Audio" />
    <meta name="description" content="Free open-source web music player with sub-second synced lyrics for Tamil, Tanglish, Hindi & English, 8D audio, a 3-band EQ and nightcore/slowed effects." />

    <meta name="apple-mobile-web-app-title" content="Zenify" />

    <!-- Google Site Name Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Zenify",
      "alternateName": ["Zenify Music", "ListenZenify", "Zenify Web Player"],
      "url": "https://listenzenify.vercel.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://listenzenify.vercel.app/discover?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <meta name="google-site-verification" content="google66ee582c33341a73" />
    <meta name="google-site-verification" content="66ee582c33341a73" />

    <!-- Performance preconnects (Fonts are bundled locally via @fontsource) -->
    <link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin />
    <link rel="dns-prefetch" href="https://va.vercel-scripts.com" />
    
    <script>
      (function() {
        // Clean up URL query if recovery cache-bust was triggered
        try {
          if (window.location.search.includes('_zenify_bust=')) {
            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('_zenify_bust');
            window.history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
          }
        } catch (_) {}

        // Proactively delete any stale HTML documents precached by legacy service workers
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (name.includes('precache') || name.includes('workbox')) {
                caches.open(name).then(function(c) {
                  c.delete('/');
                  c.delete('/index.html');
                  c.delete('index.html');
                }).catch(function() {});
              }
            });
          }).catch(function() {});
        }

        function recoverFromStaleAssets(reason) {
          const RECOVERY_KEY = 'zenify_last_asset_recovery_ts';
          const now = Date.now();
          const lastRecovery = parseInt(sessionStorage.getItem(RECOVERY_KEY) || '0', 10);
          // Prevent infinite reload loops: allow auto-recovery at most once every 12 seconds
          if (now - lastRecovery < 12000) return;
          sessionStorage.setItem(RECOVERY_KEY, String(now));

          console.warn('[Zenify Self-Healing] Stale build asset detected (' + reason + '). Purging caches & reloading fresh...');

          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                try { regs[i].unregister(); } catch (_) {}
              }
            }).catch(function() {});
          }

          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                try { caches.delete(keys[j]); } catch (_) {}
              }
            }).catch(function() {});
          }

          setTimeout(function() {
            var sep = window.location.href.indexOf('?') !== -1 ? '&' : '?';
            window.location.replace(window.location.href + sep + '_zenify_bust=' + now);
          }, 80);
        }

        // Capture phase listener for <link> and <script> failures (MIME type mismatch or 404)
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'LINK' || target.tagName === 'SCRIPT')) {
            var resourceUrl = target.src || target.href || '';
            if (resourceUrl && (resourceUrl.indexOf('/assets/') !== -1 || resourceUrl.indexOf('index-') !== -1)) {
              recoverFromStaleAssets('Missing asset: ' + resourceUrl);
              return;
            }
          }
          var msg = e.message || '';
          if (
            msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('MIME type') !== -1 ||
            msg.indexOf('strict MIME checking') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          ) {
            recoverFromStaleAssets('Script error: ' + msg);
          }
        }, true);

        // Capture dynamic import rejection errors
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (
            reason.indexOf('dynamically imported module') !== -1 ||
            reason.indexOf('error loading dynamically imported module') !== -1 ||
            reason.indexOf('MIME type') !== -1 ||
            reason.indexOf('Loading chunk') !== -1
          ) {
            recoverFromStaleAssets('Promise rejection: ' + reason);
          }
        });
      })();
    </script>
    <style>
      :root {
        --font-inter: 'Inter', system-ui, -apple-system, sans-serif;

      }

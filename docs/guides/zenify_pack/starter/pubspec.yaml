# Merge into the generated pubspec.yaml. Verify and pin current versions.
name: zenify
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  intl: any
  flutter_bloc: any
  get_it: any
  go_router: any
  dio: any
  freezed_annotation: any
  json_annotation: any
  drift: any
  sqlite3_flutter_libs: any
  shared_preferences: any
  flutter_secure_storage: any
  cached_network_image: any
  material_color_utilities: any
  motor: any
  smooth_sheets: any
  flutter_animate: any
  rive: any
  shimmer: any
  text_scroll: any
  scrollable_positioned_list: any
  sensors_plus: any
  flutter_displaymode: any
  on_audio_query: any
  permission_handler: any
  connectivity_plus: any
  share_plus: any
  stomp_dart_client: any
  web_socket_channel: any
  talker_flutter: any
dev_dependencies:
  flutter_test: { sdk: flutter }
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any
  drift_dev: any
  bloc_test: any
  mocktail: any
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
    - assets/mock/lrc/
    - assets/images/
    - assets/rive/
  fonts:
    - family: SF Pro Display
      fonts:
        - { asset: assets/fonts/SF-Pro-Display-Regular.otf }
        - { asset: assets/fonts/SF-Pro-Display-Semibold.otf, weight: 600 }
        - { asset: assets/fonts/SF-Pro-Display-Bold.otf, weight: 700 }
    - family: SF Pro Text
      fonts:
        - { asset: assets/fonts/SF-Pro-Text-Regular.otf }
        - { asset: assets/fonts/SF-Pro-Text-Medium.otf, weight: 500 }
        - { asset: assets/fonts/SF-Pro-Text-Semibold.otf, weight: 600 }
    - family: Inter
      fonts:
        - { asset: assets/fonts/Inter-Regular.ttf }
        - { asset: assets/fonts/Inter-Medium.ttf, weight: 500 }
        - { asset: assets/fonts/Inter-SemiBold.ttf, weight: 600 }
        - { asset: assets/fonts/Inter-Bold.ttf, weight: 700 }

/**
 * Main application module build configuration for the Zenify Android app.
 * This file defines the Android application settings, dependencies, and build logic.
 */

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    /**
     * The unique namespace for the application.
     */
    namespace = "com.zenify.app"

    /**
     * The SDK version used to compile the application.
     * Defined in the root project's build.gradle.
     */
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        /**
         * The application's unique ID on the Google Play Store.
         */
        applicationId "com.zenify.app"

        /**
         * Minimum and Target SDK versions for the application.
         * Defined in the root project's build.gradle.
         */
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        /**
         * Version code and name for the application.
         */
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    /**
     * Configuration for different build types (e.g., release, debug).
     */
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

/**
 * Repository configuration for the application module.
 */
repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

/**
 * Project dependencies including AndroidX libraries, Capacitor core, and plugins.
 */
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"
    
    // Jetpack Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2025.01.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation "io.coil-kt:coil-compose:2.6.0"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/**
 * Apply Capacitor-specific build logic.
 */
apply from: 'capacitor.build.gradle'

/**
 * Conditional application of Google Services plugin.
 * This is required for Firebase services like Push Notifications.
 * If google-services.json is missing, the plugin is not applied.
 */
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

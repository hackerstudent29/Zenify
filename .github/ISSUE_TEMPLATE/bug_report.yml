name: 🐛 Bug Report
description: Create a report to help us fix a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with Zenify!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. When pressing spacebar to pause, audio keeps playing..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Affected Platform
      options:
        - Web Player (Desktop Chrome/Edge)
        - Web Player (Desktop Firefox/Safari)
        - Web Player (Mobile Browser)
        - Flutter Android App
        - Backend API / Self-hosting
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device / OS / Browser
      placeholder: "e.g. Windows 11 / Chrome 124 or Android 14 / Samsung Galaxy S23"

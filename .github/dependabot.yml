version: 2

updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hackerstudent29"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(backend):"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version bumps for critical dependencies
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastify"
        update-types: ["version-update:semver-major"]

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hackerstudent29"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(frontend):"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version bumps for critical dependencies
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hackerstudent29"
    labels:
      - "ci/cd"
    commit-message:
      prefix: "ci:"

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "hackerstudent29"
    labels:
      - "docker"

